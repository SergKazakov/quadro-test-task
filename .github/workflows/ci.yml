name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: node_modules
          key: ${{ hashFiles('package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ hashFiles('package-lock.json') }}
      - parallel:
          - run: npx eslint
          - run: npx tsc
          - run: node --run test
